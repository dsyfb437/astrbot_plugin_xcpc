name: astrbot_plugin_xcpc # 插件唯一识别名（必须与目录名一致，否则重载会找不到目录）
display_name: XCPC 备赛助手 # 展示名（需 AstrBot >= v4.5.0，低版本忽略不报错）
desc: 把 XCPC 备赛工作区接进聊天软件 —— 地铁上用一段话完成 VP 复盘，随手查状态、题单和今天的任务；QOJ 的榜单/提交记录直接粘进来就能自动补全过题、罚时和 AC 顺序。
short_desc: 用聊天完成 XCPC 复盘与训练查询。
version: v0.5.21
author: dsyfb437
repo: https://github.com/dsyfb437/astrbot_plugin_xcpc
# ⚠️ 从 4.26 起才有「插件 Pages」能力（WebUI 里挂自定义页面 + register_web_api），
# 账号绑定页依赖它。低于这个版本插件仍能加载，但点不进绑定页。
# 已在官方文档 `dev/star/guides/plugin-pages` 和 AstrBot 源码
# `astrbot/dashboard/services/plugin_page_service.py` 中核实。
astrbot_version: ">=4.26,<5"

# 声明支持平台（可选字段，WebUI 插件页会展示）。
# 本插件只用「收文本 / 发文本」这两件最基础的事，理论上所有适配器都能跑。
# 唯一要注意的差别是**主动推送**（每日汇报 + /推送测试）：
#   支持：aiocqhttp(OneBot v11，配 NapCat / Lagrange) / Telegram / Discord
#         / 飞书 / Slack / Satori / Misskey
#   不支持：QQ 官方机器人（qq_official）—— 平台没开放主动消息 API
# 换句话说：**QQ 个人号能推送，QQ 官方机器人不能**。
# 实际部署走的是 aiocqhttp（NapCat），所以推送是可用功能，不是"看运气"。
# 如果某个 AstrBot 版本因为这份列表把插件挡在门外，直接删掉下面整段即可。
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - discord
  - lark
  - slack
  - wecom
  - satori
  - misskey
